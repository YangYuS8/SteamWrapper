[workspace]
members = [
    "crates/core",
    "crates/manager-core",
    "crates/runner",
    "apps/manager-dioxus",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/YangYuS8/SteamWrapper"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
