[workspace]
members = [
    "crates/core",
    "crates/runner",
    "apps/manager/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/YangYuS8/SteamWrapper"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "creation-flags", "job-object", "process-group"] }
