name: Documentation

on:
  push:
    branches: [v2]
    paths:
      - 'docs/**'
      - 'assets/brand/**'
      - 'scripts/generate-brand.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    branches: [v2]
    paths:
      - 'docs/**'
      - 'assets/brand/**'
      - 'scripts/generate-brand.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate bilingual documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Node and pnpm are installed explicitly; docs do not need desktop toolchains.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.1'
          install_args: 'node pnpm'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source, translations and canonical assets
        run: |
          mise run brand:check
          mise run docs:check
      - name: Build and validate static output
        run: mise run docs:build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v2'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
