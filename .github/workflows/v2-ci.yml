name: v2 CI

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check required project docs
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md",
            "README.md",
            "README.zh-CN.md",
            "LICENSE",
            "assets/brand/steamwrapper.svg",
            "apps/manager/src/assets/steamwrapper.svg",
            "apps/manager/src-tauri/icons/icon.png",
            "docs/tech-stack.md",
            "docs/architecture.md",
            "docs/distribution.md",
            "docs/roadmap.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Check v2 license metadata
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern 'license = "Apache-2.0"' -Quiet)) {
            throw "Cargo workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "package workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "apps/manager/package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "manager package license must be Apache-2.0"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Type-check manager frontend
        run: pnpm --filter steamwrapper-manager lint

      - name: Build manager frontend
        run: pnpm --filter steamwrapper-manager build

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

  e2e-browser:
    name: E2E Browser (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Type-check E2E workspace
        run: pnpm --filter steamwrapper-manager-e2e exec tsc --noEmit

      - name: Run Browser Mode E2E
        run: pnpm e2e:browser

      - name: Upload Browser Mode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-artifacts
          path: apps/manager-e2e/artifacts/browser
          if-no-files-found: ignore

  e2e-native-windows:
    name: E2E Native (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Type-check E2E workspace
        run: pnpm --filter steamwrapper-manager-e2e exec tsc --noEmit

      - name: Build Native Mode test binary
        run: pnpm e2e:native:build

      - name: Run Native Mode E2E
        run: pnpm e2e:native

      - name: Upload Native Mode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-native-windows-artifacts
          path: apps/manager-e2e/artifacts/native
          if-no-files-found: ignore
