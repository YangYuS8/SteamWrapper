name: v2 CI

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2", "feat/runner-process-lifecycle"]
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            xauth \
            dbus-daemon

      - name: Check required project docs and assets
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md",
            "README.md",
            "README.zh-CN.md",
            "LICENSE",
            "assets/brand/steamwrapper.svg",
            "apps/manager-dioxus/assets/steamwrapper.svg",
            "apps/manager-dioxus/assets/icons/steamwrapper.png",
            "apps/manager-dioxus/assets/icons/steamwrapper.ico",
            "apps/manager-dioxus/Dioxus.toml",
            "apps/manager-dioxus/scripts/stage-runner.sh",
            "docs/tech-stack.md",
            "docs/architecture.md",
            "docs/distribution.md",
            "docs/roadmap.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Check v2 license metadata
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern 'license = "Apache-2.0"' -Quiet)) {
            throw "Cargo workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "package workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "apps/manager-dioxus/e2e/package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "Dioxus Manager E2E package license must be Apache-2.0"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend and E2E dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Type-check Dioxus native E2E suite
        run: pnpm --filter steamwrapper-manager-dioxus-e2e exec tsc --noEmit

      - name: Test native E2E startup diagnostics
        run: pnpm --filter steamwrapper-manager-dioxus-e2e run test:tooling

      - name: Stage Manager Runner resource
        shell: pwsh
        run: |
          $env:STEAMWRAPPER_RUNNER_PROFILE = "release"
          if ($IsWindows) {
            cargo build --release --package steamwrapper-runner
            $resourceDir = "apps/manager-dioxus/resources/runner"
            New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
            Copy-Item target/release/steamwrapper-runner.exe "$resourceDir/SteamWrapperRunner.exe" -Force
            New-Item -ItemType File -Force -Path "$resourceDir/steamwrapper-runner" | Out-Null
            if (-not (Test-Path "$resourceDir/SteamWrapperRunner.exe" -PathType Leaf)) { throw "Windows Runner was not staged" }
          } else {
            bash apps/manager-dioxus/scripts/stage-runner.sh
            test -s apps/manager-dioxus/resources/runner/steamwrapper-runner
          }

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

      - name: Check Dioxus project
        working-directory: apps/manager-dioxus
        run: dx check

      - name: Build Dioxus Manager
        working-directory: apps/manager-dioxus
        run: dx build --release

      - name: Build Dioxus native E2E
        run: cargo build -p steamwrapper-manager-dioxus --features e2e

      - name: Run Dioxus native E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" dbus-run-session -- pnpm --filter steamwrapper-manager-dioxus-e2e run e2e:native

      - name: Run Dioxus native E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter steamwrapper-manager-dioxus-e2e run e2e:native

      - name: Upload Dioxus native E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dioxus-native-e2e-${{ matrix.os }}
          path: apps/manager-dioxus/e2e/artifacts/native
          if-no-files-found: ignore

      - name: Run Linux process-group integration test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo test -p steamwrapper-runner process_group_waits_for_descendants_after_launcher_exits -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Eq 'running 1 test' <<< "$output"
          grep -Eq 'test result: ok\. 1 passed;' <<< "$output"

      - name: Run Windows Job Object integration test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cargo test -p steamwrapper-runner job_object_waits_for_descendants_after_launcher_exits -- --nocapture 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "Windows Job Object integration test failed" }
          if ($output -notmatch 'running 1 test') { throw "Windows Job Object integration test did not run exactly one test" }
          if ($output -notmatch 'test result: ok\. 1 passed;') { throw "Windows Job Object integration test did not pass" }

      - name: Run process-name integration tests
        shell: pwsh
        run: |
          $tests = if ($IsWindows) {
            @('process_name_waits_for_a_new_named_process_after_launcher_exits_on_windows', 'process_name_requires_a_non_empty_name_before_launching')
          } else {
            @('process_name_waits_for_a_new_named_process_after_launcher_exits', 'process_name_ignores_matching_processes_that_existed_before_launch', 'process_name_waits_across_named_process_replacement', 'process_name_requires_a_non_empty_name_before_launching')
          }
          foreach ($test in $tests) {
            $qualified = "platform::tests::$test"
            $output = cargo test -p steamwrapper-runner -- --exact $qualified --nocapture 2>&1 | Out-String
            Write-Output $output
            if ($LASTEXITCODE -ne 0) { throw "process_name integration test failed: $test" }
            if ($output -notmatch 'running 1 test') { throw "process_name integration test did not run exactly once: $test" }
            if ($output -notmatch 'test result: ok\. 1 passed;') { throw "process_name integration test did not pass: $test" }
          }


  bundle-linux:
    name: Bundle Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Stage Linux Runner resource
        shell: bash
        run: STEAMWRAPPER_RUNNER_PROFILE=release apps/manager-dioxus/scripts/stage-runner.sh

      - name: Build AppImage
        working-directory: apps/manager-dioxus
        run: dx bundle --release --package-types appimage --out-dir ../../release-artifacts

      - name: Verify AppImage contains Runner resource
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$GITHUB_WORKSPACE/release-artifacts" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          find "$extract_dir/squashfs-root" -type f -path '*/SteamWrapperManager/steamwrapper-runner' -size +0c -print -quit | grep -q .

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: SteamWrapper-linux-appimage
          path: release-artifacts/*.AppImage
          if-no-files-found: error
