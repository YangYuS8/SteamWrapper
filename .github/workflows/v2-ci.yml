name: Rust core and Runner CI

on:
  push:
    branches: ["main", "v2"]
    paths: &rust_paths
      - 'crates/**'
      - 'tests/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.vsconfig'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/winui-release.yml'
  pull_request:
    branches: ["main", "v2"]
    paths: *rust_paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check required project docs and assets
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md", "README.md", "README.zh-CN.md", "LICENSE",
            "CONTRIBUTING.md", "CONTRIBUTING.zh-CN.md",
            "CODE_OF_CONDUCT.md", "CODE_OF_CONDUCT.zh-CN.md",
            "SECURITY.md", "SECURITY.zh-CN.md", "SUPPORT.md", "SUPPORT.zh-CN.md",
            ".github/PULL_REQUEST_TEMPLATE.md", ".github/PULL_REQUEST_TEMPLATE/zh-CN.md",
            ".github/ISSUE_TEMPLATE/config.yml",
            "assets/brand/steamwrapper.svg", "assets/brand/steamwrapper.png", "assets/brand/steamwrapper.ico",
            "apps/manager-winui/SteamWrapper.Manager/SteamWrapper.Manager.csproj",
            "apps/manager-winui/SteamWrapper.Application/SteamWrapper.Application.csproj",
            "docs/src/content/docs/development/stack.md",
            "docs/src/content/docs/development/architecture.md",
            "docs/src/content/docs/development/distribution.md",
            "docs/src/content/docs/project/roadmap.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required file missing: $file" }
          }

      - name: Check license metadata
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern 'license = "Apache-2.0"' -Quiet)) {
            throw "Cargo workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "package workspace license must be Apache-2.0"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cache locked Cargo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml', 'mise.toml') }}

      # Build normal binaries, then reuse dependencies for one workspace test run.
      # Require each real process case in that run instead of rerunning it.
      - name: Build and test the workspace with real platform process cases
        shell: pwsh
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo build --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw 'Rust workspace build failed.' }
          $output = cargo test --locked --workspace -- --color never 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0) { throw 'Rust workspace tests failed.' }
          $tests = if ($IsWindows) {
            @(
              'job_object_waits_for_descendants_after_launcher_exits',
              'process_name_waits_for_a_new_named_process_after_launcher_exits_on_windows',
              'process_name_observes_a_named_process_before_launcher_exits_on_windows',
              'process_name_accepts_the_named_launcher_itself_on_windows',
              'process_name_requires_a_non_empty_name_before_launching'
            )
          } else {
            @(
              'process_group_waits_for_descendants_after_launcher_exits',
              'process_name_waits_for_a_new_named_process_after_launcher_exits',
              'process_name_ignores_matching_processes_that_existed_before_launch',
              'process_name_waits_across_named_process_replacement',
              'process_name_requires_a_non_empty_name_before_launching'
            )
          }
          foreach ($test in $tests) {
            $qualified = "platform::tests::$test"
            $passed = [regex]::Matches($output, "(?m)^test $([regex]::Escape($qualified)) \.\.\. ok\r?$").Count
            if ($passed -ne 1) { throw "Required real-process case did not pass exactly once: $test" }
          }
