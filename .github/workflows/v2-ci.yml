name: v2 CI

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check required project docs
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md",
            "README.md",
            "README.zh-CN.md",
            "LICENSE",
            "assets/brand/steamwrapper.svg",
            "apps/manager/src/assets/steamwrapper.svg",
            "apps/manager/src-tauri/icons/icon.png",
            "docs/tech-stack.md",
            "docs/architecture.md",
            "docs/distribution.md",
            "docs/roadmap.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Check v2 license metadata
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern 'license = "Apache-2.0"' -Quiet)) {
            throw "Cargo workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "package workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "apps/manager/package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "manager package license must be Apache-2.0"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Type-check manager frontend
        run: pnpm --filter steamwrapper-manager lint

      - name: Build manager frontend
        env:
          VITE_STEAMWRAPPER_E2E: "0"
        run: pnpm --filter steamwrapper-manager build

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

      - name: Run Linux process-group integration test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo test -p steamwrapper-runner process_group_waits_for_descendants_after_launcher_exits -- --nocapture 2>&1)"
          printf '%s\n' "$output"
          grep -Eq 'running 1 test' <<< "$output"
          grep -Eq 'test result: ok\. 1 passed;' <<< "$output"

      - name: Run Windows Job Object integration test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cargo test -p steamwrapper-runner job_object_waits_for_descendants_after_launcher_exits -- --nocapture 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "Windows Job Object integration test failed" }
          if ($output -notmatch 'running 1 test') { throw "Windows Job Object integration test did not run exactly one test" }
          if ($output -notmatch 'test result: ok\. 1 passed;') { throw "Windows Job Object integration test did not pass" }

      - name: Build Windows NSIS with Runner resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --package steamwrapper-runner
          if (-not (Test-Path target/release/steamwrapper-runner.exe)) { throw "Release Runner was not built" }
          $env:STEAMWRAPPER_RUNNER_SKIP_BUILD = "1"
          pnpm --filter steamwrapper-manager stage:runner
          if (-not (Test-Path apps/manager/src-tauri/resources/runner/SteamWrapperRunner.exe)) { throw "Runner was not staged for Tauri resources" }
          pnpm --filter steamwrapper-manager tauri build --bundles nsis
          $bundle = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $bundle) { throw "NSIS bundle was not produced" }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip is required to inspect the NSIS bundle" }
          $extract = Join-Path $env:RUNNER_TEMP "steamwrapper-nsis-$env:GITHUB_RUN_ID"
          & $sevenZip x -y "-o$extract" $bundle.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract NSIS bundle" }
          Get-ChildItem $extract -Recurse -File -Filter *.7z | ForEach-Object {
            & $sevenZip x -y "-o$($_.DirectoryName)" $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not extract bundled payload: $($_.FullName)" }
          }
          $runner = Get-ChildItem $extract -Recurse -File -Filter SteamWrapperRunner.exe | Where-Object Length -gt 0 | Select-Object -First 1
          if (-not $runner) { throw "NSIS bundle does not contain a non-empty SteamWrapperRunner.exe" }
          if ((cargo tree -p steamwrapper-manager -e normal) -match 'tauri-plugin-wdio') { throw "Release graph must not contain WDIO plugins" }
          $env:VITE_STEAMWRAPPER_E2E = "0"
          pnpm --filter steamwrapper-manager build
          pnpm --filter steamwrapper-manager verify:release-e2e-isolation

  e2e-browser:
    name: E2E Browser (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E workspace
        run: pnpm --filter steamwrapper-manager-e2e exec tsc --noEmit

      - name: Run Browser Mode E2E
        run: pnpm e2e:browser

      - name: Upload Browser Mode artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-browser-artifacts
          path: apps/manager-e2e/artifacts/browser
          if-no-files-found: ignore

  e2e-native-windows:
    name: E2E Native (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E workspace
        run: pnpm --filter steamwrapper-manager-e2e exec tsc --noEmit

      - name: Build Native Mode test binary
        run: pnpm e2e:native:build

      - name: Run Native Mode E2E
        run: pnpm e2e:native

      - name: Upload Native Mode artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-native-windows-artifacts
          path: apps/manager-e2e/artifacts/native
          if-no-files-found: ignore
