name: v2 CI

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required project docs
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md",
            "README.md",
            "README.zh-CN.md",
            "LICENSE",
            "docs/tech-stack.md",
            "docs/architecture.md",
            "docs/distribution.md",
            "docs/roadmap.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Check v2 license metadata
        shell: pwsh
        run: |
          if (-not (Select-String -Path "Cargo.toml" -Pattern 'license = "Apache-2.0"' -Quiet)) {
            throw "Cargo workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "package workspace license must be Apache-2.0"
          }
          if (-not (Select-String -Path "apps/manager/package.json" -Pattern '"license": "Apache-2.0"' -Quiet)) {
            throw "manager package license must be Apache-2.0"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check manager frontend
        run: pnpm --filter steamwrapper-manager lint

      - name: Build manager frontend
        run: pnpm --filter steamwrapper-manager build

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace
