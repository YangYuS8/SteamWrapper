name: Mirror an existing release to CNB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag currently authorized by its update feed
        type: string
        required: true
      refreshPresentation:
        description: Refresh only the verified CNB title and Chinese body
        type: boolean
        default: false

permissions:
  contents: read

# Serialize with version publication and scheduled renewal. A queued historical
# mirror run must recheck the current signed release after acquiring this lock.
concurrency:
  group: steamwrapper-update-feeds
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      REFRESH_PRESENTATION: ${{ inputs.refreshPresentation }}
      CNB_GIT_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
      CNB_RELEASE_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN || secrets.CNB_GIT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the current signed release and its exact public downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ([string]::IsNullOrWhiteSpace($env:CNB_GIT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CNB_RELEASE_TOKEN)) {
            throw 'Configure CNB_GIT_TOKEN for tag pushes and repo-release read/write, or a separate CNB_RELEASE_TOKEN for releases.'
          }
          $tag = $env:RELEASE_TAG
          . ./scripts/windows/WinUIRelease.ps1
          $tagIdentity = Get-WinUIReleaseTag $tag
          $commit = (& git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[a-f0-9]{40}$') { throw 'The selected source tag does not exist.' }
          & git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The source tag must already be merged into main.' }
          $repository = 'YangYuS8/SteamWrapper'
          $private = & gh api "repos/$repository" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -cne 'false') { throw 'The source release repository must be public.' }
          . ./scripts/releases/ProjectUpdates.ps1
          $trustPath = 'packaging/windows/update-trust.json'
          $trust = Read-ProjectUpdateTrust $trustPath
          $feedDirectory = 'target/cnb-release-mirror/current-feed'
          [IO.Directory]::CreateDirectory($feedDirectory) | Out-Null
          & gh release download ("update-" + $tagIdentity.Channel) --repo $repository --pattern SteamWrapper-update.json --dir $feedDirectory
          if ($LASTEXITCODE -ne 0) { throw 'The previously signed channel feed is required.' }
          $feedPath = Join-Path $feedDirectory 'SteamWrapper-update.json'
          $current = Read-ProjectUpdateEnvelope -Path $feedPath -TrustPath $trustPath -AllowExpired
          $directory = "target/cnb-release-mirror/$tag"
          # Historical versions retain all seven files and their full validator.
          # Compact downloads bind the three public files to signed Setup bytes
          # and keep API/signature/source-note verification outside those files.
          $metadata = & ./scripts/releases/Download-PublishedRelease.ps1 -Tag $tag -Commit $commit -PackageDirectory $directory -EnvelopePath $feedPath
          $candidate = New-ProjectUpdatePayload -ReleaseMetadata $metadata -Trust $trust -IncludeCnbMirror
          Assert-ProjectUpdateCurrentRelease -Payload $candidate -ExistingPayload $current
          if ($metadata.schemaVersion -eq 3) {
            "PUBLIC_RELEASE_VERIFICATION_PATH=$($metadata.verificationPath)" >> $env:GITHUB_ENV
          }
          Write-Output "Verified the complete public download set for $tag at $commit; the signed feed authorizes this exact release."
      - name: Push the matching source tag without rewriting history
        if: ${{ !inputs.refreshPresentation }}
        shell: bash
        run: |
          set -euo pipefail
          helper='!f() { printf "username=cnb\npassword=%s\n" "$CNB_GIT_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" push https://cnb.cool/Nesoriel/SteamWrapper "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Publish and download-verify identical CNB assets
        shell: pwsh
        run: |
          $publication = @{ PackageDirectory = "target/cnb-release-mirror/$env:RELEASE_TAG"; Repository = 'Nesoriel/SteamWrapper' }
          if ($env:PUBLIC_RELEASE_VERIFICATION_PATH) { $publication.PublicReleaseVerificationPath = $env:PUBLIC_RELEASE_VERIFICATION_PATH }
          if ($env:REFRESH_PRESENTATION -eq 'true') { $publication.RefreshPresentation = $true }
          ./scripts/releases/Publish-CnbRelease.ps1 @publication
      - name: Add the verified mirror to the same authorized update release
        if: ${{ !inputs.refreshPresentation }}
        shell: pwsh
        env:
          STEAMWRAPPER_UPDATE_PRIVATE_KEY: ${{ secrets.STEAMWRAPPER_UPDATE_PRIVATE_KEY }}
        run: |
          $package = "target/cnb-release-mirror/$env:RELEASE_TAG"
          $publication = @{ PackageDirectory = $package }
          if ($env:PUBLIC_RELEASE_VERIFICATION_PATH) {
            $publication.PublicReleaseVerificationPath = $env:PUBLIC_RELEASE_VERIFICATION_PATH
            . ./scripts/releases/PublicReleaseDownload.ps1
            $metadata = Read-WinUIPublicReleaseVerification -PackageDirectory $package -VerificationPath $env:PUBLIC_RELEASE_VERIFICATION_PATH
          } else {
            $metadata = & ./scripts/windows/Test-WinUIReleasePackage.ps1 -PackageDirectory $package
          }
          ./scripts/releases/Publish-UpdateMetadata.ps1 @publication -IncludeCnbMirror -RequireCurrentRelease
          if ($metadata.releaseChannel -ceq 'stable') {
            . ./scripts/releases/ProjectUpdates.ps1
            $directory = 'target/cnb-release-mirror/preview-feed'
            [IO.Directory]::CreateDirectory($directory) | Out-Null
            $reply = (& gh release download update-preview --repo YangYuS8/SteamWrapper --pattern SteamWrapper-update.json --dir $directory 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) {
              $trustPath = 'packaging/windows/update-trust.json'
              $current = Read-ProjectUpdateEnvelope -Path (Join-Path $directory 'SteamWrapper-update.json') -TrustPath $trustPath -AllowExpired
              $candidate = New-ProjectUpdatePayload -ReleaseMetadata $metadata -Trust (Read-ProjectUpdateTrust $trustPath) -Channel preview -IncludeCnbMirror
              if ($current.release.tag -ceq $candidate.release.tag) {
                Assert-ProjectUpdateCurrentRelease -Payload $candidate -ExistingPayload $current
                ./scripts/releases/Publish-UpdateMetadata.ps1 @publication -Channel preview -IncludeCnbMirror -RequireCurrentRelease
              }
            } else {
              # An absent preview feed need not block maintenance of stable.
              if ($reply -notmatch '(release not found|HTTP 404)') { throw 'Cannot inspect the signed preview feed for mirror maintenance.' }
              $global:LASTEXITCODE = 0
            }
          }
