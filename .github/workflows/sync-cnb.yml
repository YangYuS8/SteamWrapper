name: Sync to CNB

on:
  push:
    branches: ["main", "v2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push current ref to CNB
        env:
          CNB_GIT_TOKEN: ${{ secrets.CNB_GIT_TOKEN }}
          CNB_REMOTE_URL: https://cnb.cool/Nesoriel/SteamWrapper
        run: |
          set -euo pipefail
          test -n "${CNB_GIT_TOKEN:-}" || { echo "CNB_GIT_TOKEN is not configured" >&2; exit 1; }
          test -n "${CNB_REMOTE_URL:-}" || { echo "CNB_REMOTE_URL repository variable is not configured" >&2; exit 1; }

          test "${GITHUB_REF_TYPE}" = "branch" || { echo "Tag mirroring belongs to the version release workflow" >&2; exit 1; }
          helper='!f() { printf "username=cnb\npassword=%s\n" "$CNB_GIT_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$helper" push "$CNB_REMOTE_URL" "HEAD:refs/heads/${GITHUB_REF_NAME}"
