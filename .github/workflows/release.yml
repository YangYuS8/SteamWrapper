name: v2 Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-latest
            bundle: nsis
            artifact_glob: "target/release/bundle/nsis/*.exe"
          - name: linux-x64
            os: ubuntu-latest
            bundle: appimage
            artifact_glob: "target/release/bundle/appimage/*.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.release_tag.outputs.tag }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like v2.1.0" >&2; exit 1 ;;
          esac

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm --filter steamwrapper-manager lint
          pnpm --filter steamwrapper-manager build
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace

      - name: Build Tauri bundle
        run: pnpm --filter steamwrapper-manager tauri build --bundles ${{ matrix.target.bundle }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob
          files=( ${{ matrix.target.artifact_glob }} )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle files matched: ${{ matrix.target.artifact_glob }}" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            cp "$file" "release-artifacts/SteamWrapper-${{ steps.release_tag.outputs.tag }}-${{ matrix.target.name }}-${file##*/}"
          done
          (cd release-artifacts && sha256sum * > "SHA256SUMS-${{ matrix.target.name }}.txt")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteamWrapper-${{ steps.release_tag.outputs.tag }}-${{ matrix.target.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${tag}$" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          {
            printf '## SteamWrapper %s\n\n' "$tag"
            printf '面向玩家的 v2 LTS 发布包。国内玩家后续可优先从 CNB Release 下载，GitHub Release 保留作为同步渠道。\n\n'
            printf '## 安装 / 更新 / 卸载\n\n'
            printf -- '- Windows：下载 setup.exe 后双击安装；更新时运行新版安装包覆盖旧版本，用户配置会保留。\n'
            printf -- '- Linux / SteamOS：下载 AppImage 或 tar.gz；更新时替换程序文件，XDG 数据目录会保留。\n'
            printf -- '- 卸载默认只删除程序本体；清理用户数据前请确认已备份。\n\n'
            printf '## Changes\n\n'
            git log "$range" --reverse --pretty=format:'- %s (`%h`, %an)' || true
            printf '\n'
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SteamWrapper ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
