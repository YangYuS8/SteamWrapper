name: v2 Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-latest
            bundle: nsis
            artifact_glob: "release-artifacts/*.exe"
          - name: linux-x64
            os: ubuntu-latest
            bundle: appimage
            artifact_glob: "release-artifacts/*.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.release_tag.outputs.tag }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must look like v2.1.0" >&2; exit 1 ;;
          esac

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Build and stage Runner resource
        shell: pwsh
        run: |
          if ($IsWindows) {
            cargo build --release --package steamwrapper-runner
            $resourceDir = "apps/manager-dioxus/resources/runner"
            New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
            Copy-Item target/release/steamwrapper-runner.exe "$resourceDir/SteamWrapperRunner.exe" -Force
            New-Item -ItemType File -Force -Path "$resourceDir/steamwrapper-runner" | Out-Null
            if (-not (Test-Path "$resourceDir/SteamWrapperRunner.exe" -PathType Leaf)) { throw "Windows Runner was not staged" }
          } else {
            bash apps/manager-dioxus/scripts/stage-runner.sh
            test -s apps/manager-dioxus/resources/runner/steamwrapper-runner
          }

      - name: Run quality gates
        run: |
          pnpm --filter steamwrapper-manager-dioxus-e2e exec tsc --noEmit
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace
          cd apps/manager-dioxus
          dx check
          dx build --release

      - name: Build Dioxus bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cd apps/manager-dioxus
          dx bundle --release --package-types ${{ matrix.target.bundle }} --out-dir ../../release-artifacts

      - name: Verify Windows NSIS contains Runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem release-artifacts -Filter *.exe | Select-Object -First 1
          if (-not $bundle) { throw "NSIS bundle was not produced" }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip is required to inspect the NSIS bundle" }
          $extract = Join-Path $env:RUNNER_TEMP "steamwrapper-dioxus-nsis-$env:GITHUB_RUN_ID"
          & $sevenZip x -y "-o$extract" $bundle.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract NSIS bundle" }
          Get-ChildItem $extract -Recurse -File -Filter *.7z | ForEach-Object {
            & $sevenZip x -y "-o$($_.DirectoryName)" $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not extract bundled payload: $($_.FullName)" }
          }
          $runner = Get-ChildItem $extract -Recurse -File -Filter SteamWrapperRunner.exe | Where-Object Length -gt 0 | Select-Object -First 1
          if (-not $runner) { throw "NSIS bundle does not contain a non-empty SteamWrapperRunner.exe" }

      - name: Verify Linux AppImage contains Runner resource
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$GITHUB_WORKSPACE/release-artifacts" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          find "$extract_dir/squashfs-root" -type f -path '*/SteamWrapperManager/steamwrapper-runner' -size +0c -print -quit | grep -q .

      - name: Verify release excludes E2E runtime
        shell: bash
        run: |
          set -euo pipefail
          ! cargo tree -p steamwrapper-manager-dioxus -e normal | grep -Eq 'wdio-dioxus-(bridge|embedded-driver)'

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${{ matrix.target.artifact_glob }} )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle files matched: ${{ matrix.target.artifact_glob }}" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            cp "$file" "release-artifacts/SteamWrapper-${{ steps.release_tag.outputs.tag }}-${{ matrix.target.name }}-${file##*/}"
          done
          (cd release-artifacts && sha256sum SteamWrapper-* > "SHA256SUMS-${{ matrix.target.name }}.txt")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SteamWrapper-${{ steps.release_tag.outputs.tag }}-${{ matrix.target.name }}
          path: release-artifacts/SteamWrapper-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${tag}$" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi
          {
            printf '## SteamWrapper %s\n\n' "$tag"
            printf 'This workflow packages the retained Dioxus Manager and independent Rust Runner. The WinUI Windows preview is distributed separately by its preview workflow.\n\n'
            printf '## Install / update / uninstall\n\n'
            printf -- '- Windows: download and run the attached NSIS setup executable. An update replaces application files while retaining the stable user data directory.\n'
            printf -- '- Linux: download the attached AppImage, make it executable, and launch it. Replace the AppImage to update; XDG user data remains separate. SteamOS-specific acceptance is not implied.\n'
            printf -- '- Keep profiles and previous Steam Launch Options backed up. Before uninstalling, restore Steam Launch Options; retained user data and the stable Runner require a separate, deliberate cleanup.\n'
            printf -- '- Manager defaults to English; select Simplified Chinese in its language control. See README and docs/distribution.md for the delivery scope and recovery steps.\n\n'
            printf '## 简体中文：安装 / 更新 / 卸载\n\n'
            printf '本工作流分发保留的 Dioxus Manager 与独立 Rust Runner；WinUI Windows 预览由单独的预览工作流提供。\n\n'
            printf -- '- Windows：下载并运行附件中的 NSIS 安装程序；更新替换应用文件，保留稳定用户数据目录。\n'
            printf -- '- Linux：下载附件中的 AppImage，赋予执行权限后运行；更新时替换 AppImage，XDG 用户数据独立保留。这不代表已通过 SteamOS 专项验收。\n'
            printf -- '- 备份配置和原 Steam 启动项。卸载前恢复 Steam 启动项；保留的用户数据和稳定 Runner 须另行确认清理。\n'
            printf -- '- Manager 默认英语，可在语言控件中选择简体中文。分发范围与恢复步骤见中文 README 和 docs/distribution.zh-CN.md。\n\n'
            printf '## Changes\n\n'
            git log "$range" --reverse --pretty=format:'- %s (`%h`, %an)' || true
            printf '\n'
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SteamWrapper ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
