name: "缺陷报告（简体中文）"
description: "报告可复现的 SteamWrapper 问题。"
body:
  -
    type: "markdown"
    attributes:
      value: "疑似漏洞请先阅读[安全策略](https://github.com/YangYuS8/SteamWrapper/blob/v2/SECURITY.zh-CN.md)。不要公开利用细节、凭据、存档、游戏二进制、完整 Steam 配置或未脱敏的个人路径。"
  -
    type: "input"
    id: "version"
    attributes:
      label: "版本、分支或提交"
      description: "例如 v2 与构建使用的提交；不要假定默认分支就是 v2。"
    validations:
      required: true
  -
    type: "input"
    id: "platform"
    attributes:
      label: "平台"
      description: "Windows 版本／内部版本和架构，或具体的已有 Linux 环境。"
    validations:
      required: true
  -
    type: "dropdown"
    id: "manager"
    attributes:
      label: "Manager 实现"
      options:
        - "WinUI 预览"
        - "Dioxus"
        - "仅 Runner"
        - "旧版 main"
        - "不确定"
    validations:
      required: true
  -
    type: "textarea"
    id: "summary"
    attributes:
      label: "发生了什么？"
      description: "描述实际行为和预期结果。"
    validations:
      required: true
  -
    type: "textarea"
    id: "steps"
    attributes:
      label: "复现步骤"
      description: "尽可能使用最少步骤和模拟数据。"
    validations:
      required: true
  -
    type: "textarea"
    id: "launch"
    attributes:
      label: "启动信息（如适用）"
      description: "等待模式、从程序自身目录正常启动同一目标是否可用、Manager 是否关闭及 Steam 的表现。区分进程创建、标题出现、普通退出、时长和成就。"
  -
    type: "textarea"
    id: "logs"
    attributes:
      label: "相关脱敏日志或截图"
      description: "可选。只分享相关的小段内容，移除个人路径和账号信息。"
  -
    type: "checkboxes"
    id: "checks"
    attributes:
      label: "提交前检查"
      description: "[行为准则](https://github.com/YangYuS8/SteamWrapper/blob/v2/CODE_OF_CONDUCT.zh-CN.md)"
      options:
        -
          label: "我已搜索现有 issue 和文档。"
          required: true
        -
          label: "我同意遵守项目行为准则。"
          required: true
        -
          label: "我已移除私人数据，且没有公开报告安全漏洞。"
          required: true
