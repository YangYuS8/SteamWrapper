[package]
name = "steamwrapper-manager-dioxus"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
steamwrapper-manager-core = { path = "../../crates/manager-core" }

[features]
default = []
e2e = ["dep:wdio-dioxus-embedded-driver"]

[dependencies.wdio-dioxus-embedded-driver]
version = "1.0.0"
optional = true

[[bin]]
name = "SteamWrapperManager"
path = "src/main.rs"

[build-dependencies]
