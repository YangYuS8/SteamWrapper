$:
  tag_push:
    - name: release
      runner:
        cpus: 16
      docker:
        image: cnbcool/default-build-env:latest
      stages:
        - name: verify release tag
          script: |
            set -euo pipefail
            case "$CNB_BRANCH" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "Skip non-semver tag: $CNB_BRANCH"; exit 0 ;;
            esac

        - name: generate release notes
          if: 'case "$CNB_BRANCH" in v[0-9]*.[0-9]*.[0-9]*) exit 0 ;; *) exit 1 ;; esac'
          script: |
            set -euo pipefail
            TAG_NAME="$CNB_BRANCH"
            previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..${TAG_NAME}"
              compare_url="https://cnb.cool/${CNB_REPO_SLUG}/-/compare/${previous_tag}...${TAG_NAME}"
            else
              range="${TAG_NAME}"
              compare_url=""
            fi
            {
              printf '## SteamWrapper %s\n\n' "$TAG_NAME"
              printf 'SteamWrapper 标签发布说明。/ Tag release notes.\n\n'
              printf '## 下载说明\n\n'
              printf -- '- 此工作流同步标签和说明，不构建或上传二进制附件。/ This workflow publishes tag notes, not binary assets.\n'
              printf -- '- 实际可用产物及安装限制以安装指南为准。/ See the installation guide for available artifacts and limitations.\n'
              printf -- '- https://yangyus8.top/SteamWrapper/guides/installation/\n'
              printf -- '- https://yangyus8.top/SteamWrapper/zh-cn/guides/installation/\n\n'
              printf '## Changes\n\n'
              git log "$range" --reverse --pretty=format:'- %s (`%h`, %an)' || true
              if [ -n "$compare_url" ]; then
                printf '\n\n**Full Changelog**: %s\n' "$compare_url"
              fi
            } > release-notes.md

        - name: publish CNB release
          if: 'case "$CNB_BRANCH" in v[0-9]*.[0-9]*.[0-9]*) exit 0 ;; *) exit 1 ;; esac'
          type: git:release
          options:
            tag: $CNB_BRANCH
            title: SteamWrapper $CNB_BRANCH
            descriptionFromFile: release-notes.md
